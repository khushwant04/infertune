<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">InferTune</title>
  <desc id="desc">The InferTune wordmark beside a GPU memory bar split into the memory ledger: weights, CUDA graphs, activations, and the KV cache, with the binding constraint marked.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="kv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.6"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="178" font-size="84" font-weight="700" fill="#f8fafc" letter-spacing="-2">Infer<tspan fill="#22d3ee">Tune</tspan></text>
    <text x="84" y="228" font-size="26" fill="#cbd5e1">Size, tune and benchmark LLM serving</text>
    <text x="84" y="262" font-size="26" fill="#cbd5e1">before you rent the GPU.</text>
    <text x="84" y="322" font-size="18" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">github.com/khushwant04/infertune</text>
  </g>

  <!-- The memory ledger as one GPU's VRAM, bottom to top. -->
  <g transform="translate(760 70)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="0" y="0" width="140" height="260" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <!-- weights -->
    <rect x="8" y="128" width="124" height="124" rx="4" fill="#6366f1"/>
    <!-- graphs + activations + workspace -->
    <rect x="8" y="104" width="124" height="20" rx="3" fill="#a855f7"/>
    <rect x="8" y="88" width="124" height="12" rx="3" fill="#f59e0b"/>
    <!-- KV cache, the binding constraint -->
    <rect x="8" y="22" width="124" height="62" rx="4" fill="url(#kv)"/>
    <rect x="8" y="8" width="124" height="10" rx="3" fill="#1e293b" stroke="#475569" stroke-dasharray="4 3"/>

    <g fill="#94a3b8">
      <line x1="150" y1="190" x2="176" y2="190" stroke="#475569"/>
      <text x="184" y="195">weights</text>
      <line x1="150" y1="114" x2="176" y2="114" stroke="#475569"/>
      <text x="184" y="119">graphs · activations</text>
      <line x1="150" y1="13" x2="176" y2="13" stroke="#475569"/>
      <text x="184" y="18">driver reserve</text>
    </g>
    <line x1="150" y1="53" x2="176" y2="53" stroke="#22d3ee"/>
    <text x="184" y="50" fill="#22d3ee" font-weight="700">KV cache</text>
    <text x="184" y="70" fill="#67e8f9">binding constraint</text>
  </g>
</svg>
