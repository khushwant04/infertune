[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infertune"
version = "0.1.0"
description = "GPU-aware inference configuration profiler: size, tune and benchmark LLM serving before you rent the GPU."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Khushwant Sanwalot" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["llm", "inference", "vllm", "sglang", "gpu", "kv-cache", "capacity-planning", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]

# NOTE: infertune.core is deliberately stdlib-only; see tests/test_core_purity.py.
# These dependencies exist for the CLI/reporting layers only.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
hf = ["huggingface-hub>=0.24"]
nvml = ["nvidia-ml-py>=12.560"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
infertune = "infertune.cli:main"

[project.urls]
Homepage = "https://github.com/khushwant04/infertune"
Documentation = "https://github.com/khushwant04/infertune/tree/main/docs"
Repository = "https://github.com/khushwant04/infertune"
Issues = "https://github.com/khushwant04/infertune/issues"
Changelog = "https://github.com/khushwant04/infertune/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/infertune"]

[tool.hatch.build.targets.wheel.force-include]
"src/infertune/hardware/gpus.json" = "infertune/hardware/gpus.json"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Optional, GPU-only dependencies that are deliberately absent from CI. They are imported
# lazily inside functions, so their absence is a supported runtime state, not an error.
module = ["typer", "rich.*", "vllm", "vllm.*", "sglang", "sglang.*", "pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: requires network access to the Hugging Face Hub (opt in with --run-network)",
]
